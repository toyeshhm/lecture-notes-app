name: LectureNotes
options:
  bundleIdPrefix: com.toyeshhm
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  LectureKit:
    path: Packages/LectureKit

targets:
  LectureNotes:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: Assets/Plates
        type: folder
        buildPhase: resources
    resources:
      - App/Resources
    dependencies:
      - package: LectureKit
        product: LectureKit
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleName: Lecture Notes
        CFBundleDisplayName: Lecture Notes
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        # The app records lectures; without this string macOS kills it on first
        # tap instead of prompting.
        NSMicrophoneUsageDescription: >-
          Lecture Notes records your lectures so it can transcribe them on this
          Mac. Audio never leaves your machine.
        NSHumanReadableCopyright: MIT
        LSApplicationCategoryType: public.app-category.education
    entitlements:
      path: App/Resources/LectureNotes.entitlements
      properties:
        # Sandbox is OFF deliberately. The app spawns the `claude` binary and
        # writes into an Obsidian vault that lives outside any container; both
        # are impossible under App Sandbox. Still notarizable, but this rules
        # out the Mac App Store.
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "0.1"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_IDENTITY: "-"

  Snapshot:
    # An application, not a tool: a `tool` target has no resource bundle, so
    # Bundle.main finds no plates and every course renders an empty frame.
    # LSUIElement keeps it out of the Dock while it renders.
    type: application
    platform: macOS
    # Renders the app's views to PNG headlessly. Screenshotting a running app
    # needs Screen Recording permission and only reaches the states you can coax
    # it into; this reaches all of them, including failure and empty.
    sources:
      - path: Tools/Snapshot
      - path: App/Sources
        excludes: ["LectureNotesApp.swift"]   # @main would collide with the tool's
      - path: Assets/Plates
        type: folder
        buildPhase: resources
    dependencies:
      - package: LectureKit
        product: LectureKit
    info:
      path: Tools/Snapshot/Info.plist
      properties:
        CFBundleName: Snapshot
        LSUIElement: true
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
